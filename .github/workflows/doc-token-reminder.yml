name: doc-token-reminder(腾讯文档 Token 到期提醒)

# 每天北京时间 10:00 检查 QQ_DOC_ACCESS_TOKEN 的剩余有效期；
# 剩余 <= 7 天（或已过期）就通过 Server酱 推送到个人微信，提醒去重新授权并更新 secret。
# 到期日优先从 token 的 JWT exp 解析，不需要手工维护日期（QQ_DOC_ACCESS_TOKEN_EXPIRE_DATE 只作兜底）。
#
# 需要配置的 Secrets：
#   SCT_SENDKEY           Server酱 SendKey
#   QQ_DOC_ACCESS_TOKEN   腾讯文档 access_token（二期也用这个）
# 可选 Variables：QQ_DOC_ACCESS_TOKEN_EXPIRE_DATE（兜底到期日，YYYY-MM-DD）、QQ_DOC_TOKEN_WARN_DAYS（默认 7）

on:
  schedule:
    - cron: "12 2 * * *"   # 北京 10:12
  workflow_dispatch:
    inputs:
      warn_days:
        description: '剩余多少天开始提醒（默认 7）'
        required: false
        default: ''
      dry_run:
        description: '只打印，不推送'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: doc-token-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查 access_token 有效期
        env:
          TZ: Asia/Shanghai
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          QQ_DOC_ACCESS_TOKEN: ${{ secrets.QQ_DOC_ACCESS_TOKEN }}
          QQ_DOC_ACCESS_TOKEN_EXPIRE_DATE: ${{ vars.QQ_DOC_ACCESS_TOKEN_EXPIRE_DATE || secrets.QQ_DOC_ACCESS_TOKEN_EXPIRE_DATE }}
          WARN_DAYS: ${{ github.event.inputs.warn_days }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${WARN_DAYS}" ]; then
            ARGS+=(--warn-days "${WARN_DAYS}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python wechat-notify.py ${ARGS[@]+"${ARGS[@]}"}
